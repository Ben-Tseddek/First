<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toca do Café</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: uma única tela — o campo de jogo centralizado, escalado para caber, com a legenda de controles embaixo. Visual único (escuro, cor de terra), por escolha. */
:root{
  --bg:#140c07; --panel:#24160d; --ink:#f7ead2; --muted:#c7a988; --accent:#f6c431; --leaf:#7bbf3a;
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--body);
  display:flex; flex-direction:column; align-items:center; gap:10px; box-sizing:border-box; overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:12px;
  background-image:radial-gradient(ellipse at 50% 0%, #2a180d 0%, var(--bg) 70%);
}
#wrap{flex:1 1 auto; min-height:0; width:100%; display:flex; align-items:center; justify-content:center}
canvas{display:block; border-radius:14px; touch-action:none; outline:none;
  box-shadow:0 24px 70px rgba(0,0,0,.65), 0 0 0 1px rgba(246,196,49,.14)}
canvas:focus-visible{box-shadow:0 0 0 3px var(--accent)}
.help{font-size:13px; color:var(--muted); text-align:center; line-height:1.6}
kbd{font-family:var(--body); font-weight:800; font-size:12px; color:var(--ink); background:var(--panel);
  border:1px solid rgba(246,196,49,.25); border-bottom-width:2px; border-radius:6px; padding:1px 7px}
#pad{display:none; width:100%; max-width:520px; justify-content:space-between; align-items:center; gap:12px; user-select:none; -webkit-user-select:none}
.dpad{display:grid; grid-template-columns:repeat(3,54px); grid-template-rows:repeat(2,50px); gap:6px}
#pad button{font:800 18px var(--body); color:var(--ink); background:var(--panel); border:1px solid rgba(246,196,49,.3);
  border-radius:12px; touch-action:none}
#pad button:active,#pad button.on{background:#3b2414}
.dpad [data-d=up]{grid-column:2; grid-row:1}
.dpad [data-d=left]{grid-column:1; grid-row:2}
.dpad [data-d=down]{grid-column:2; grid-row:2}
.dpad [data-d=right]{grid-column:3; grid-row:2}
.acts{display:flex; flex-direction:column; gap:8px}
#seedBtn{width:110px; height:64px; color:#1c1206 !important; background:var(--accent) !important}
#startBtn{width:110px; height:36px; font-size:14px !important}
@media (pointer:coarse){ #pad{display:flex} .help{display:none} }
@media (prefers-reduced-motion:reduce){ canvas{box-shadow:none} }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" tabindex="0" aria-label="Jogo Toca do Café"></canvas></div>
<div class="help">
  <kbd>←</kbd> <kbd>↑</kbd> <kbd>↓</kbd> <kbd>→</kbd> ou <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> cavar e andar ·
  <kbd>Espaço</kbd> lançar a semente · <kbd>P</kbd> pausa · <kbd>M</kbd> som · <kbd>Enter</kbd> iniciar
</div>
<div id="pad">
  <div class="dpad">
    <button data-d="up" aria-label="Cima">▲</button>
    <button data-d="left" aria-label="Esquerda">◀</button>
    <button data-d="down" aria-label="Baixo">▼</button>
    <button data-d="right" aria-label="Direita">▶</button>
  </div>
  <div class="acts">
    <button id="seedBtn">Semente</button>
    <button id="startBtn">Iniciar / Pausa</button>
  </div>
</div>
<script>
(() => {
'use strict';
// ───────────────────────── Constantes ─────────────────────────
const COLS = 13, ROWS = 10, T = 56, HUD = 80;
const PW = COLS * T, PH = ROWS * T, W = PW, H = PH + HUD;
const NEST = { c: 6, r: 4 }, START = { c: 6, r: 9 };
const RES = 2, TAU = Math.PI * 2;
const DIRS = { left: { dx: -1, dy: 0 }, right: { dx: 1, dy: 0 }, up: { dx: 0, dy: -1 }, down: { dx: 0, dy: 1 } };
const DLIST = [DIRS.left, DIRS.right, DIRS.up, DIRS.down];

// Solos de cada nível. A cor vem principalmente dos óxidos de ferro:
// hematita (Fe2O3) avermelha, goethita (FeO(OH)) amarela, matéria orgânica escurece.
const SOILS = [
  { name: 'Terra Roxa',     a: '#a3502e', b: '#6a2b17', c: '#3c160b', speck: ['#c46a42', '#80351d', '#2c0e06', '#d58a5a'], tun: ['#2b130a', '#100603'] },
  { name: 'Barro Dourado',  a: '#b98440', b: '#7f5123', c: '#4a2c12', speck: ['#d9a25a', '#8f5d2a', '#3a210c', '#e8c07a'], tun: ['#2a190b', '#0f0804'] },
  { name: 'Húmus da Mata',  a: '#6a4e34', b: '#45311f', c: '#261a10', speck: ['#8a6a48', '#3a2818', '#1a110a', '#9e8058'], tun: ['#1c120a', '#0b0704'] },
  { name: 'Argila do Rio',  a: '#9a6a5a', b: '#694237', c: '#3a221c', speck: ['#b88a78', '#7a5044', '#2a1612', '#c9a090'], tun: ['#24130f', '#0d0605'] },
];

const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
let K = 1;

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const cx = c => c * T + T / 2, cy = r => r * T + T / 2;
const inB = (c, r) => c >= 0 && c < COLS && r >= 0 && r < ROWS;
const grid = v => Array.from({ length: ROWS }, () => Array(COLS).fill(v));
const nearest = (x, y) => ({ c: clamp(Math.round((x - T / 2) / T), 0, COLS - 1), r: clamp(Math.round((y - T / 2) / T), 0, ROWS - 1) });
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

function ell(g, x, y, rx, ry, rot = 0) { g.beginPath(); g.ellipse(x, y, Math.max(0.01, rx), Math.max(0.01, ry), rot, 0, TAU); }
function rrect(g, x, y, w, h, r) {
  g.beginPath();
  if (g.roundRect) { g.roundRect(x, y, w, h, r); return; }
  g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w * RES; c.height = h * RES; const g = c.getContext('2d'); g.scale(RES, RES); return [c, g]; }

// ───────────────────────── Tamanho da tela ─────────────────────────
function resize() {
  const wrap = document.getElementById('wrap');
  const aw = wrap.clientWidth, ah = wrap.clientHeight;
  const s = Math.max(0.3, Math.min(aw / W, ah / H));
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cvs.style.width = Math.floor(W * s) + 'px';
  cvs.style.height = Math.floor(H * s) + 'px';
  cvs.width = Math.floor(W * s * dpr); cvs.height = Math.floor(H * s * dpr);
  K = cvs.width / W;
}
window.addEventListener('resize', resize);

// ───────────────────────── Áudio (sintetizado, original) ─────────────────────────
let AC = null, master = null, musicGain = null, muted = false, musicStep = 0, nextNoteT = 0;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.45; master.connect(AC.destination);
    musicGain = AC.createGain(); musicGain.gain.value = 0.32; musicGain.connect(master);
    nextNoteT = AC.currentTime + 0.1;
  } catch (e) { AC = null; }
}
function tone(f, d, type = 'square', v = 0.12, slide = 0, delay = 0, dest) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + d);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(v, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(dest || master); o.start(t); o.stop(t + d + 0.05);
}
let noiseBuf = null;
function noise(d, v = 0.15, freq = 900, delay = 0) {
  if (!AC || muted) return;
  if (!noiseBuf) { noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const ch = noiseBuf.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1; }
  const t = AC.currentTime + delay;
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + d + 0.05);
}
const SFX = {
  dig: () => noise(0.06, 0.05, 500),
  cherry: n => { const f = 660 * Math.pow(2, Math.min(n, 8) * 2 / 12); tone(f, 0.12, 'triangle', 0.14); tone(f * 2, 0.08, 'sine', 0.05, 0, 0.03); },
  chain: () => [0, 4, 7, 12, 16].forEach((s, i) => tone(523 * Math.pow(2, s / 12), 0.16, 'triangle', 0.13, 0, i * 0.06)),
  throw: () => tone(380, 0.18, 'sawtooth', 0.06, 2.4),
  ready: () => { tone(880, 0.07, 'sine', 0.08); tone(1320, 0.09, 'sine', 0.06, 0, 0.06); },
  hit: () => { tone(220, 0.25, 'square', 0.1, 0.4); noise(0.2, 0.12, 2200); },
  wobble: () => tone(150, 0.12, 'triangle', 0.08, 0.8),
  fall: () => tone(900, 0.45, 'sine', 0.07, 0.35),
  thud: () => { tone(90, 0.3, 'sine', 0.25, 0.5); noise(0.25, 0.18, 400); },
  crush: () => { tone(160, 0.35, 'square', 0.1, 0.3); noise(0.3, 0.15, 900); },
  death: () => [0, -3, -6, -9, -12, -15].forEach((s, i) => tone(440 * Math.pow(2, s / 12), 0.22, 'square', 0.08, 0, i * 0.12)),
  clear: () => [0, 4, 7, 12, 7, 12, 16, 19].forEach((s, i) => tone(392 * Math.pow(2, s / 12), 0.2, 'triangle', 0.13, 0, i * 0.09)),
  gem: () => [0, 7, 12, 19, 24].forEach((s, i) => tone(784 * Math.pow(2, s / 12), 0.25, 'sine', 0.09, 0, i * 0.05)),
  life: () => [0, 5, 9, 12].forEach((s, i) => tone(523 * Math.pow(2, s / 12), 0.18, 'square', 0.07, 0, i * 0.08)),
  dud: () => tone(140, 0.1, 'square', 0.06),
};
// Trilha original em pentatônica (semitons acima de Dó4; null = pausa)
const MEL = [12, null, 16, 19, 21, null, 19, 16, 14, null, 16, null, 12, null, 9, null,
             12, null, 16, 19, 21, null, 24, 21, 19, null, 16, 14, 16, null, null, null,
             21, null, 19, 21, 24, null, 21, 19, 16, null, 19, null, 14, null, 12, null,
             9, null, 12, 14, 16, null, 14, 12, 9, null, 7, 9, 12, null, null, null];
const BASS = [0, 0, 7, 7, 9, 9, 7, 7, 5, 5, 4, 4, 2, 2, 7, 7];
function musicTick() {
  if (!AC || muted || !(state === 'play' || state === 'intro') || paused) { if (AC) nextNoteT = AC.currentTime + 0.05; return; }
  const stepDur = 60 / 138 / 2;
  while (nextNoteT < AC.currentTime + 0.15) {
    const d = nextNoteT - AC.currentTime;
    const m = MEL[musicStep % MEL.length];
    if (m !== null) tone(261.63 * Math.pow(2, m / 12), stepDur * 1.6, 'triangle', 0.09, 0, Math.max(0, d), musicGain);
    if (musicStep % 4 === 0) tone(65.41 * Math.pow(2, BASS[(musicStep / 4 | 0) % BASS.length] / 12), stepDur * 3.2, 'sine', 0.16, 0, Math.max(0, d), musicGain);
    if (musicStep % 2 === 1) noise(0.03, 0.025, 6000, Math.max(0, d));
    musicStep++; nextNoteT += stepDur;
  }
}
setInterval(musicTick, 50);

// ───────────────────────── Camadas de terreno ─────────────────────────
const [dirtC, dctx] = mkCanvas(PW, PH);
const [bgC, bctx] = mkCanvas(PW, PH);
const compC = document.createElement('canvas'); compC.width = PW * RES; compC.height = PH * RES;
const kctx = compC.getContext('2d');
let terrainDirty = true, lastComp = 0, soil = SOILS[0];

function buildTerrain(lv) {
  soil = SOILS[(lv - 1) % SOILS.length];
  // fundo dos túneis
  bctx.globalCompositeOperation = 'source-over';
  let g = bctx.createLinearGradient(0, 0, 0, PH);
  g.addColorStop(0, soil.tun[0]); g.addColorStop(1, soil.tun[1]);
  bctx.fillStyle = g; bctx.fillRect(0, 0, PW, PH);
  for (let i = 0; i < 1400; i++) { bctx.fillStyle = `rgba(255,220,180,${rnd(0.02, 0.07)})`; bctx.fillRect(rnd(0, PW), rnd(0, PH), rnd(0.6, 1.6), rnd(0.6, 1.6)); }
  // terra
  dctx.globalCompositeOperation = 'source-over';
  dctx.clearRect(0, 0, PW, PH);
  g = dctx.createLinearGradient(0, 0, 0, PH);
  g.addColorStop(0, soil.a); g.addColorStop(0.55, soil.b); g.addColorStop(1, soil.c);
  dctx.fillStyle = g; dctx.fillRect(0, 0, PW, PH);
  for (let i = 0; i < 9; i++) {
    const y0 = rnd(-10, PH), th = rnd(10, 34), ph = rnd(0, 6);
    dctx.fillStyle = i % 2 ? 'rgba(255,225,180,0.055)' : 'rgba(0,0,0,0.09)';
    dctx.beginPath(); dctx.moveTo(0, y0);
    for (let x = 0; x <= PW; x += 16) dctx.lineTo(x, y0 + Math.sin(x * 0.012 + ph) * 7);
    for (let x = PW; x >= 0; x -= 16) dctx.lineTo(x, y0 + th + Math.sin(x * 0.015 + ph * 1.3) * 6);
    dctx.closePath(); dctx.fill();
  }
  for (let i = 0; i < 6500; i++) {
    dctx.globalAlpha = rnd(0.25, 0.8); dctx.fillStyle = pick(soil.speck);
    const s = rnd(0.7, 2.4); dctx.fillRect(rnd(0, PW), rnd(0, PH), s, s);
  }
  dctx.globalAlpha = 1;
  for (let i = 0; i < 80; i++) {
    const x = rnd(0, PW), y = rnd(0, PH), r = rnd(2, 6.5), rot = rnd(0, 3);
    const pg = dctx.createRadialGradient(x - r * 0.3, y - r * 0.4, 0.5, x, y, r * 1.2);
    pg.addColorStop(0, '#d8cbb8'); pg.addColorStop(0.6, '#8b7a68'); pg.addColorStop(1, '#4a3e34');
    dctx.fillStyle = 'rgba(0,0,0,.25)'; ell(dctx, x + 1, y + 1.5, r, r * 0.7, rot); dctx.fill();
    dctx.fillStyle = pg; ell(dctx, x, y, r, r * 0.7, rot); dctx.fill();
  }
  dctx.lineCap = 'round';
  for (let i = 0; i < 16; i++) {
    let x = rnd(0, PW), y = 0; const len = rnd(40, 150);
    dctx.strokeStyle = `rgba(${rnd(200, 235) | 0},${rnd(170, 200) | 0},${rnd(120, 150) | 0},${rnd(0.18, 0.32)})`;
    dctx.lineWidth = rnd(1, 2.4);
    dctx.beginPath(); dctx.moveTo(x, y);
    for (let s = 0; s < len; s += 8) { x += rnd(-5, 5); y += 8; dctx.lineTo(x, y); if (Math.random() < 0.15) { dctx.moveTo(x, y); dctx.lineTo(x + rnd(-14, 14), y + rnd(4, 14)); dctx.moveTo(x, y); } }
    dctx.stroke();
  }
  const tg = dctx.createLinearGradient(0, 0, 0, 26);
  tg.addColorStop(0, 'rgba(20,10,4,.45)'); tg.addColorStop(1, 'rgba(20,10,4,0)');
  dctx.fillStyle = tg; dctx.fillRect(0, 0, PW, 26);
  terrainDirty = true;
}
function carve(x, y, r) {
  dctx.save(); dctx.globalCompositeOperation = 'destination-out';
  const g = dctx.createRadialGradient(x, y, r * 0.6, x, y, r);
  g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  dctx.fillStyle = g; dctx.beginPath(); dctx.arc(x, y, r, 0, TAU); dctx.fill();
  dctx.restore(); terrainDirty = true;
}
function carveLine(x1, y1, x2, y2, r) {
  const n = Math.max(1, Math.ceil(Math.hypot(x2 - x1, y2 - y1) / 4));
  for (let i = 0; i <= n; i++) carve(x1 + (x2 - x1) * i / n, y1 + (y2 - y1) * i / n, r);
}
function compose() {
  kctx.setTransform(1, 0, 0, 1, 0, 0);
  kctx.clearRect(0, 0, compC.width, compC.height);
  kctx.drawImage(bgC, 0, 0);
  kctx.save();
  kctx.shadowColor = 'rgba(0,0,0,0.85)'; kctx.shadowBlur = 26; kctx.shadowOffsetY = 12;
  kctx.drawImage(dirtC, 0, 0);
  kctx.restore();
  terrainDirty = false;
}

// ───────────────────────── Céu e grama (pré-desenhados) ─────────────────────────
const [skyC, sctx] = mkCanvas(W, HUD + 14);
(function buildSky() {
  let g = sctx.createLinearGradient(0, 0, 0, HUD);
  g.addColorStop(0, '#79c3f2'); g.addColorStop(1, '#d6efff');
  sctx.fillStyle = g; sctx.fillRect(0, 0, W, HUD);
  const sg = sctx.createRadialGradient(W - 90, 18, 4, W - 90, 18, 120);
  sg.addColorStop(0, 'rgba(255,250,215,.95)'); sg.addColorStop(0.15, 'rgba(255,240,180,.6)'); sg.addColorStop(1, 'rgba(255,240,180,0)');
  sctx.fillStyle = sg; sctx.fillRect(0, 0, W, HUD);
  const hill = (base, amp, f, ph, col) => {
    sctx.fillStyle = col; sctx.beginPath(); sctx.moveTo(0, HUD);
    for (let x = 0; x <= W; x += 8) sctx.lineTo(x, base + Math.sin(x * f + ph) * amp + Math.sin(x * f * 2.7 + ph) * amp * 0.35);
    sctx.lineTo(W, HUD); sctx.closePath(); sctx.fill();
  };
  hill(44, 9, 0.008, 1, '#9cc9a8'); hill(56, 8, 0.012, 3, '#6fae63'); hill(66, 5, 0.02, 5, '#4f9446');
  // pés de café no horizonte
  for (let i = 0; i < 9; i++) {
    const x = 30 + i * 84 + rnd(-10, 10), y = HUD - 12;
    sctx.fillStyle = '#2f6e2c';
    for (let k = 0; k < 6; k++) { ell(sctx, x + rnd(-9, 9), y - rnd(4, 16), rnd(6, 9), rnd(5, 7)); sctx.fill(); }
    sctx.fillStyle = '#3f8a37'; ell(sctx, x - 3, y - 14, 6, 5); sctx.fill();
    for (let k = 0; k < 5; k++) { sctx.fillStyle = '#f6c431'; sctx.beginPath(); sctx.arc(x + rnd(-8, 8), y - rnd(4, 14), 1.6, 0, TAU); sctx.fill(); }
  }
  g = sctx.createLinearGradient(0, HUD - 8, 0, HUD + 6);
  g.addColorStop(0, '#5fae3c'); g.addColorStop(1, '#2e6a1f');
  sctx.fillStyle = g; sctx.fillRect(0, HUD - 8, W, 10);
  sctx.lineCap = 'round';
  for (let x = 0; x < W; x += 2.2) {
    const h = rnd(5, 14);
    sctx.strokeStyle = Math.random() < 0.5 ? '#4f9a33' : '#6cc246'; sctx.lineWidth = rnd(1, 2);
    sctx.beginPath(); sctx.moveTo(x, HUD - 4); sctx.quadraticCurveTo(x + rnd(-3, 3), HUD - 4 - h * 0.6, x + rnd(-4, 4), HUD - 4 - h); sctx.stroke();
  }
  sctx.fillStyle = '#2e6a1f';
  sctx.beginPath(); sctx.moveTo(0, HUD + 1);
  for (let x = 0; x <= W; x += 6) sctx.lineTo(x, HUD + 2 + Math.abs(Math.sin(x * 0.37)) * 7 + rnd(0, 3));
  sctx.lineTo(W, HUD); sctx.lineTo(0, HUD); sctx.closePath(); sctx.fill();
})();
const [vigC, vctx] = mkCanvas(PW, PH);
(function () {
  const g = vctx.createRadialGradient(PW / 2, PH / 2, PH * 0.35, PW / 2, PH / 2, PW * 0.72);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.5)');
  vctx.fillStyle = g; vctx.fillRect(0, 0, PW, PH);
})();

// ───────────────────────── Sprites pré-desenhados ─────────────────────────
function sprite(w, h, fn) { const [c, g] = mkCanvas(w, h); g.translate(w / 2, h / 2); fn(g); return c; }
const cherrySpr = sprite(T, T, g => {
  g.save(); g.translate(1, -15); g.rotate(-0.45);
  const lg = g.createLinearGradient(-4, 0, 18, 0); lg.addColorStop(0, '#2b7027'); lg.addColorStop(1, '#86cf4a');
  g.fillStyle = lg; ell(g, 7, 0, 10, 4.6); g.fill();

    ctx.beginPath(); ctx.moveTo(16, -4); ctx.quadraticCurveTo(22, -8 + wav, 25, -10); ctx.moveTo(16, 4); ctx.quadraticCurveTo(22, 8 - wav, 25, 10); ctx.stroke();
    for (const s of [-1, 1]) {
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(14, s * 4.2, 3.8, 0, TAU); ctx.fill();
      ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(14 + lx * 1.6, s * 4.2 + ly * 1.6, 2, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(14 + lx * 1.6 + 0.6, s * 4.2 + ly * 1.6 - 0.6, 0.6, 0, TAU); ctx.fill();
    }
  }
  ctx.restore();
}
function drawJaca(j) {
  const x = j.x, y = j.y + HUD;
  if (j.state === 'break') {
    const k = j.t / 0.9;
    ctx.save(); ctx.globalAlpha = Math.max(0, 1 - k);
    for (const s of [-1, 1]) {
      ctx.save(); ctx.translate(x + s * k * 22, y + k * 8); ctx.rotate(s * k * 1.2);
      ctx.beginPath(); ctx.rect(s < 0 ? -T / 2 : 0, -T / 2, T / 2, T); ctx.clip();
      ctx.drawImage(jacaSpr, -T / 2, -T / 2, T, T);
      ctx.fillStyle = '#f7d75a'; ell(ctx, 0, 3, 4, T * 0.36); ctx.fill();
      ctx.restore();
    }
    ctx.restore(); return;
  }
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ell(ctx, 0, T * 0.43, T * 0.3, 4); ctx.fill();
  if (j.state === 'wobble') ctx.rotate(Math.sin(j.t * 38) * 0.13);
  if (j.state === 'fall') ctx.scale(0.96, 1.05);
  ctx.drawImage(jacaSpr, -T / 2, -T / 2, T, T);
  ctx.restore();
}
function drawNest() {
  const x = cx(NEST.c), y = cy(NEST.r) + HUD;
  const g = ctx.createRadialGradient(x, y, 2, x, y, T * 0.42);
  g.addColorStop(0, 'rgba(0,0,0,.95)'); g.addColorStop(0.7, 'rgba(10,4,2,.65)'); g.addColorStop(1, 'rgba(10,4,2,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, T * 0.42, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,200,150,.12)'; ctx.lineWidth = 1.5;
  for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.arc(x, y, 8 + k * 6 + ((time * 6) % 6), 0, TAU); ctx.stroke(); }
  if (state === 'play' && toSpawn > 0 && spawnT < 0.9) {
    const a = 1 - spawnT / 0.9;
    ctx.fillStyle = `rgba(255,220,90,${a})`;
    ctx.beginPath(); ctx.arc(x - 5, y - 2, 2.4, 0, TAU); ctx.arc(x + 5, y - 2, 2.4, 0, TAU); ctx.fill();
  }
}
function drawBall() {
  if (ball.state === 'fly') {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    ball.trail.forEach((p, i) => {
      const a = i / ball.trail.length;
      ctx.fillStyle = `rgba(190,255,120,${a * 0.35})`;
      ctx.beginPath(); ctx.arc(p.x, p.y + HUD, 3 + a * 5, 0, TAU); ctx.fill();
    });
    const g = ctx.createRadialGradient(ball.x, ball.y + HUD, 1, ball.x, ball.y + HUD, 18);
    g.addColorStop(0, 'rgba(240,255,200,1)'); g.addColorStop(0.3, 'rgba(170,240,90,.8)'); g.addColorStop(1, 'rgba(120,200,60,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ball.x, ball.y + HUD, 18, 0, TAU); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#6b8f2a'; ell(ctx, ball.x, ball.y + HUD, 5.5, 4, time * 12); ctx.fill();
    ctx.fillStyle = '#e8ff9a'; ell(ctx, ball.x - 1.5, ball.y + HUD - 1.2, 2, 1.2, time * 12); ctx.fill();
  } else if (ball.state === 'held' && (state === 'play' || state === 'intro')) {
    const bx = player.x + player.face * 15, by = player.y + HUD + 2 + Math.sin(time * 5) * 1.5;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(bx, by, 0, bx, by, 9);
    g.addColorStop(0, 'rgba(220,255,160,.8)'); g.addColorStop(1, 'rgba(120,200,60,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(bx, by, 9, 0, TAU); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#7aa232'; ctx.beginPath(); ctx.arc(bx, by, 3.2, 0, TAU); ctx.fill();
  }
}
function drawGem() {
  if (!diamond) return;
  const x = diamond.x, y = diamond.y + HUD + Math.sin(time * 3) * 3;
  if (diamond.t > 11 && Math.sin(time * 20) < 0) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.translate(x, y); ctx.rotate(time * 0.6);
  ctx.strokeStyle = 'rgba(160,235,255,.35)'; ctx.lineWidth = 2;
  for (let k = 0; k < 8; k++) { ctx.rotate(TAU / 8); ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(24 + Math.sin(time * 5 + k) * 4, 0); ctx.stroke(); }
  ctx.restore();
  ctx.drawImage(gemSpr, x - T / 2, y - T / 2, T, T);
}

// ───────────────────────── HUD e telas ─────────────────────────
function txt(s, x, y, size, color, align = 'left', weight = 800, font = 'display') {
  ctx.font = `${weight} ${size}px ${font === 'display' ? "'Baloo 2','Trebuchet MS',system-ui,sans-serif" : "'Nunito',system-ui,sans-serif"}`;
  ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function pill(x, y, w, h) {
  ctx.fillStyle = 'rgba(28,16,8,.62)'; rrect(ctx, x, y, w, h, 14); ctx.fill();
  ctx.strokeStyle = 'rgba(255,230,170,.2)'; ctx.lineWidth = 1; ctx.stroke();
}
function hat(x, y, s = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const g = ctx.createLinearGradient(0, -12, 0, 2); g.addColorStop(0, '#fbe39a'); g.addColorStop(1, '#c8973c');
  ctx.fillStyle = g; ell(ctx, 0, 0, 11, 3.4); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-6, 0); ctx.quadraticCurveTo(-6, -9, 0, -9); ctx.quadraticCurveTo(6, -9, 6, 0); ctx.fill();
  ctx.fillStyle = '#b8382a'; ctx.fillRect(-6, -3.4, 12, 2.4);
  ctx.restore();
}
function drawHUD() {
  pill(12, 10, 196, 54);
  txt('PONTOS', 28, 26, 11, '#e9cfa5', 'left', 800, 'body');
  txt(String(score).padStart(6, '0'), 28, 46, 26, '#fff3d6');
  txt('RECORDE', 192, 26, 11, '#e9cfa5', 'right', 800, 'body');
  txt(String(Math.max(hiscore, score)).padStart(6, '0'), 192, 46, 15, '#f6c431', 'right');
  pill(W / 2 - 110, 10, 220, 54);
  txt('NÍVEL ' + level, W / 2, 30, 22, '#fff3d6', 'center');
  txt(soil.name.toUpperCase() + '  ·  ' + Math.max(0, cherriesLeft) + ' GRÃOS', W / 2, 50, 11, '#e9cfa5', 'center', 800, 'body');
  pill(W - 208, 10, 196, 54);
  txt('VIDAS', W - 192, 26, 11, '#e9cfa5', 'left', 800, 'body');
  for (let i = 0; i < Math.min(lives, 5); i++) hat(W - 182 + i * 22, 50, 0.95);
  txt('SEMENTE', W - 28, 26, 11, '#e9cfa5', 'right', 800, 'body');
  const sx = W - 46, sy = 47;
  ctx.strokeStyle = 'rgba(255,255,255,.15)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(sx, sy, 9, 0, TAU); ctx.stroke();
  if (ball && ball.state === 'held') {
    ctx.fillStyle = '#b9f06a'; ctx.shadowColor = '#b9f06a'; ctx.shadowBlur = 10; ctx.beginPath(); ctx.arc(sx, sy, 6, 0, TAU); ctx.fill(); ctx.shadowBlur = 0;
  } else if (ball && ball.state === 'recharge') {
    const tot = Math.min(1.3 + (ball.hits - 1) * 0.5, 4.5);
    ctx.strokeStyle = '#b9f06a'; ctx.beginPath(); ctx.arc(sx, sy, 9, -Math.PI / 2, -Math.PI / 2 + TAU * (1 - ball.t / tot)); ctx.stroke();
  }
  if (muted) txt('SOM DESLIGADO (M)', W - 14, HUD + 16, 11, 'rgba(255,240,210,.7)', 'right', 800, 'body');
}
function panel(w, h) {
  const x = (W - w) / 2, y = HUD + (PH - h) / 2;
  ctx.fillStyle = 'rgba(16,9,4,.55)'; ctx.fillRect(0, HUD, W, PH);
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, 'rgba(52,32,18,.95)'); g.addColorStop(1, 'rgba(30,18,10,.95)');
  ctx.fillStyle = g; rrect(ctx, x, y, w, h, 22); ctx.fill();
  ctx.strokeStyle = 'rgba(246,196,49,.45)'; ctx.lineWidth = 1.5; ctx.stroke();
  return { x, y };
}
function titleText(s, x, y, size) {
  ctx.font = `800 ${size}px 'Baloo 2','Trebuchet MS',system-ui,sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#3a1f0c'; ctx.fillText(s, x, y + 4);
  const g = ctx.createLinearGradient(0, y - size / 2, 0, y + size / 2);
  g.addColorStop(0, '#fff3a8'); g.addColorStop(0.55, '#f6c431'); g.addColorStop(1, '#d9860c');
  ctx.fillStyle = g; ctx.fillText(s, x, y);
}
function drawOverlay() {
  const blink = Math.sin(time * 4) > -0.3;
  if (state === 'title') {
    const { y } = panel(560, 400);
    titleText('Toca do Café', W / 2, y + 62, 64);
    txt('Colha o Catuaí Amarelo debaixo da terra', W / 2, y + 108, 16, '#e9cfa5', 'center', 800, 'body');
    ctx.drawImage(cherrySpr, W / 2 - 230, y + 136, 44, 44);
    txt('Grãos de café: colha todos para passar de nível', W / 2 - 176, y + 158, 14, '#fff3d6', 'left', 600, 'body');
    ctx.drawImage(jacaSpr, W / 2 - 230, y + 184, 44, 44);
    txt('Jacas: cave por baixo e elas caem nos besouros', W / 2 - 176, y + 206, 14, '#fff3d6', 'left', 600, 'body');
    ctx.save(); ctx.fillStyle = '#b9f06a'; ctx.shadowColor = '#b9f06a'; ctx.shadowBlur = 12; ctx.beginPath(); ctx.arc(W / 2 - 208, y + 254, 7, 0, TAU); ctx.fill(); ctx.restore();
    txt('Semente mágica (Espaço): ricocheteia pelos túneis', W / 2 - 176, y + 254, 14, '#fff3d6', 'left', 600, 'body');
    ctx.drawImage(gemSpr, W / 2 - 230, y + 278, 44, 44);
    txt('Diamante no ninho: congela os inimigos', W / 2 - 176, y + 300, 14, '#fff3d6', 'left', 600, 'body');
    if (blink) txt('Pressione ENTER ou toque para jogar', W / 2, y + 356, 20, '#f6c431', 'center');
    if (hiscore) txt('Recorde: ' + hiscore, W / 2, y + 382, 12, '#c7a988', 'center', 800, 'body');
  } else if (state === 'over') {
    const { y } = panel(440, 230);
    titleText('Fim de jogo', W / 2, y + 60, 50);
    txt('Pontuação: ' + score, W / 2, y + 112, 22, '#fff3d6', 'center');
    txt(score >= hiscore && score > 0 ? 'Novo recorde!' : 'Recorde: ' + hiscore, W / 2, y + 144, 15, '#e9cfa5', 'center', 800, 'body');
    if (blink) txt('ENTER para jogar de novo', W / 2, y + 192, 18, '#f6c431', 'center');
  } else if (state === 'intro') {
    const a = Math.min(1, stateT * 2);
    ctx.save(); ctx.globalAlpha = a;
    const { y } = panel(340, 120);
    titleText('Nível ' + level, W / 2, y + 48, 42);
    txt(soil.name + ' · prepare a pá!', W / 2, y + 90, 15, '#e9cfa5', 'center', 800, 'body');
    ctx.restore();
  } else if (state === 'clear') {
    titleText('Colheita completa!', W / 2, HUD + PH / 2 - 10, 46);
  }
  if (paused) {
    const { y } = panel(300, 120);
    titleText('Pausa', W / 2, y + 50, 44);
    txt('P ou ENTER para continuar', W / 2, y + 92, 14, '#e9cfa5', 'center', 800, 'body');
  }
}

function render() {
  ctx.setTransform(K, 0, 0, K, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (shake > 0) ctx.translate(rnd(-1, 1) * shake * 10, rnd(-1, 1) * shake * 10);
  const now = performance.now();
  if (terrainDirty && now - lastComp > 30) { compose(); lastComp = now; }
  ctx.drawImage(compC, 0, HUD, PW, PH);
  drawNest();
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (!cherry[r][c]) continue;
    const bob = Math.sin(time * 2 + c * 0.7 + r) * 1.2;
    ctx.drawImage(cherrySpr, c * T, r * T + HUD + bob, T, T);
  }
  drawGem();
  for (const j of jacks) drawJaca(j);
  for (const e of enemies) drawEnemy(e);
  drawBall();
  if (player && state !== 'title') drawPlayer();
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
    ctx.fillStyle = p.c; ctx.fillRect(p.x - p.s / 2, p.y + HUD - p.s / 2, p.s, p.s);
  }
  ctx.globalAlpha = 1;
  if (freezeT > 0) { ctx.fillStyle = `rgba(140,220,255,${0.08 + Math.sin(time * 6) * 0.03})`; ctx.fillRect(0, HUD, PW, PH); }
  ctx.drawImage(vigC, 0, HUD, PW, PH);
  for (const p of pops) {
    const k = p.t / 1.3;
    ctx.globalAlpha = Math.max(0, 1 - k * k);
    const size = p.big ? 30 : 16;
    ctx.font = `800 ${size}px 'Baloo 2','Trebuchet MS',system-ui,sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const py = p.y + HUD - k * 34;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(30,14,4,.8)'; ctx.strokeText(p.text, p.x, py);
    ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, py);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  ctx.drawImage(skyC, 0, 0, W, HUD + 14);
  drawHUD();
  drawOverlay();
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  update(dt); render();
  requestAnimationFrame(frame);
}
resize();
startLevel(); state = 'title';
if (document.fonts && document.fonts.load) { document.fonts.load("800 20px 'Baloo 2'").catch(() => {}); document.fonts.load("800 14px 'Nunito'").catch(() => {}); }
requestAnimationFrame(frame);
cvs.focus();
window.__toca = { get state() { return state; }, get score() { return score; }, get level() { return level; } };
})();
</script>
</body>
</html>
