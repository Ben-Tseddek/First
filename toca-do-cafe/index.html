<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toca do Café</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: uma tela — o terreno em corte, centralizado e escalado; legenda embaixo. Visual único (noite de terra e café), por escolha. */
:root{
  --bg:#120a06; --panel:#24160d; --ink:#f7ead2; --muted:#c7a988; --accent:#f6c431; --leaf:#7bbf3a;
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--body);
  display:flex; flex-direction:column; align-items:center; gap:10px; box-sizing:border-box; overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:12px;
  background-image:radial-gradient(ellipse at 50% 0%, #2a180d 0%, var(--bg) 70%)}
#wrap{flex:1 1 auto; min-height:0; width:100%; display:flex; align-items:center; justify-content:center}
canvas{display:block; border-radius:14px; touch-action:none; outline:none;
  box-shadow:0 24px 70px rgba(0,0,0,.65), 0 0 0 1px rgba(246,196,49,.14)}
canvas:focus-visible{box-shadow:0 0 0 3px var(--accent)}
.help{font-size:13px; color:var(--muted); text-align:center; line-height:1.7}
kbd{font-family:var(--body); font-weight:800; font-size:12px; color:var(--ink); background:var(--panel);
  border:1px solid rgba(246,196,49,.25); border-bottom-width:2px; border-radius:6px; padding:1px 7px}
#pad{display:none; width:100%; max-width:520px; justify-content:space-between; align-items:center; gap:12px; user-select:none; -webkit-user-select:none}
.dpad{display:grid; grid-template-columns:repeat(3,54px); grid-template-rows:repeat(2,50px); gap:6px}
#pad button{font:800 18px var(--body); color:var(--ink); background:var(--panel); border:1px solid rgba(246,196,49,.3); border-radius:12px; touch-action:none}
#pad button.on{background:#3b2414}
.dpad [data-d=up]{grid-column:2;grid-row:1} .dpad [data-d=left]{grid-column:1;grid-row:2}
.dpad [data-d=down]{grid-column:2;grid-row:2} .dpad [data-d=right]{grid-column:3;grid-row:2}
.acts{display:flex; flex-direction:column; gap:8px}
#seedBtn{width:110px; height:64px; color:#1c1206 !important; background:var(--accent) !important}
#startBtn{width:110px; height:34px; font-size:13px !important}
#swingBtn,#furiaBtn{width:110px; height:40px}
#furiaBtn{color:#fff !important; background:#b8382a !important}
@media (pointer:coarse){ #pad{display:flex} .help{display:none} }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" tabindex="0" aria-label="Jogo Toca do Café"></canvas></div>
<div class="help">
  <kbd>←</kbd> <kbd>↑</kbd> <kbd>↓</kbd> <kbd>→</kbd> ou <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> cavar e andar ·
  <kbd>Espaço</kbd> semente · <kbd>C</kbd> golpe de pá · <kbd>F</kbd> fúria · <kbd>P</kbd> pausa · <kbd>M</kbd> som · <kbd>Enter</kbd> confirmar · controle (gamepad) também funciona
</div>
<div id="pad">
  <div class="dpad">
    <button data-d="up" aria-label="Cima">▲</button><button data-d="left" aria-label="Esquerda">◀</button>
    <button data-d="down" aria-label="Baixo">▼</button><button data-d="right" aria-label="Direita">▶</button>
  </div>
  <div class="acts"><button id="seedBtn">Semente</button><button id="swingBtn">Pá</button><button id="furiaBtn">Fúria</button><button id="startBtn">Iniciar / Pausa</button></div>
</div>
<script>
(() => {
'use strict';
// ═══════════════════════ Constantes ═══════════════════════
const COLS = 15, ROWS = 11, T = 52, HUD = 84;
const PW = COLS * T, PH = ROWS * T, W = PW, H = PH + HUD;
const NEST = { c: 7, r: 4 }, START = { c: 7, r: 10 };
const RES = 2, TAU = Math.PI * 2;
const DIRS = { left: { dx: -1, dy: 0 }, right: { dx: 1, dy: 0 }, up: { dx: 0, dy: -1 }, down: { dx: 0, dy: 1 } };

  { name: 'Normal', sub: 'Lavrador', color: '#f6c431', lives: 3, enemies: 6, speed: 1, spawn: 2.2, jacas: 9, recharge: 1, desc: ['3 vidas', 'ritmo clássico', 'inimigos variados'] },
  { name: 'Difícil', sub: 'Mestre do Terreiro', color: '#ff9f43', lives: 3, enemies: 8, speed: 1.18, spawn: 1.7, jacas: 10, recharge: 1.3, desc: ['3 vidas', 'mais rápidos', 'vespas desde o início'] },
  { name: 'Lendário', sub: 'Barão do Café', color: '#ff5a4e', lives: 2, enemies: 10, speed: 1.35, spawn: 1.25, jacas: 10, recharge: 1.6, desc: ['2 vidas', 'enxame', 'sem perdão'] },
];
// A cor de cada solo vem de um mineral. Nota mostrada na abertura do nível.
const SOILS = [
  { name: 'Terra Roxa', chem: 'vermelha pela hematita, Fe₂O₃', a: '#a3502e', b: '#6a2b17', c: '#3c160b', speck: ['#c46a42', '#80351d', '#2c0e06', '#d58a5a'], tun: ['#2b130a', '#100603'] },
  { name: 'Barro Dourado', chem: 'amarelo pela goethita, FeO(OH)', a: '#b98440', b: '#7f5123', c: '#4a2c12', speck: ['#d9a25a', '#8f5d2a', '#3a210c', '#e8c07a'], tun: ['#2a190b', '#0f0804'] },
  { name: 'Húmus da Mata', chem: 'escuro pelos ácidos húmicos da matéria orgânica', a: '#6a4e34', b: '#45311f', c: '#261a10', speck: ['#8a6a48', '#3a2818', '#1a110a', '#9e8058'], tun: ['#1c120a', '#0b0704'] },
  { name: 'Argila do Rio', chem: 'caulinita, Al₂Si₂O₅(OH)₄, que gruda na pá', a: '#9a6a5a', b: '#694237', c: '#3a221c', speck: ['#b88a78', '#7a5044', '#2a1612', '#c9a090'], tun: ['#24130f', '#0d0605'] },
  { name: 'Cascalho de Quartzo', chem: 'grãos de SiO₂ que brilham na lanterna', a: '#8c8578', b: '#5e5850', c: '#35312b', speck: ['#d8d2c4', '#6a6258', '#2a2622', '#f0ece2'], tun: ['#1b1815', '#090806'] },
];
const TODS = [
  { name: 'Manhã', dark: 0.22, top: '#6fb9ef', mid: '#b9e2ff', bot: '#e7f4ff', sun: { x: 690, y: 22, col: '#fff6c8', glow: 'rgba(255,245,200,.7)', r: 22 }, hills: ['#9cc9a8', '#6fae63', '#4f9446'], stars: 0, grass: ['#5fae3c', '#2e6a1f'], cloud: 'rgba(255,255,255,.9)' },
  { name: 'Entardecer', dark: 0.5, top: '#3b2a6b', mid: '#d86a4a', bot: '#ffc46b', sun: { x: 120, y: 58, col: '#ffb347', glow: 'rgba(255,140,60,.65)', r: 26 }, hills: ['#6a4e7a', '#4a3a5a', '#2f2640'], stars: 0.3, grass: ['#4f8a30', '#24501a'], cloud: 'rgba(255,190,150,.8)' },
  { name: 'Noite', dark: 0.84, top: '#05081a', mid: '#0e1636', mid2: '#1a2450', bot: '#28305a', sun: { x: 650, y: 26, col: '#f4f0dc', glow: 'rgba(230,230,255,.35)', r: 18, moon: true }, hills: ['#1a2240', '#121a33', '#0b1024'], stars: 1, grass: ['#2b5a22', '#143012'], cloud: 'rgba(120,130,180,.35)' },
  { name: 'Madrugada', dark: 0.42, top: '#2b2f6b', mid: '#d978a0', bot: '#ffd8a0', sun: { x: 180, y: 70, col: '#ffe0a0', glow: 'rgba(255,200,120,.6)', r: 24 }, hills: ['#7a6a9a', '#5c5a7e', '#3a4a5c'], stars: 0.5, grass: ['#4f9a33', '#2a5a1f'], cloud: 'rgba(255,220,230,.75)' },
];
const TYPES = {
  besouro: { speed: 1, dig: true, random: 0.14, pts: 500, light: 26 },
  vespa: { speed: 1.5, dig: false, random: 0.4, pts: 700, light: 20 },
  tatu: { speed: 0.72, dig: true, random: 0.1, armored: true, pts: 900, light: 22 },
  vagalume: { speed: 1.65, dig: false, random: 0.5, harmless: true, flee: true, pts: 1000, light: 70 },
  rinoceronte: { speed: 0.88, dig: true, random: 0.08, armored: true, boss: true, pts: 5000, light: 44, name: 'RINOCERONTE DA TOCA' },
};

const cvs = document.getElementById('game'), ctx = cvs.getContext('2d');
let K = 1;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const cx = c => c * T + T / 2, cy = r => r * T + T / 2;
const inB = (c, r) => c >= 0 && c < COLS && r >= 0 && r < ROWS;
const grid = v => Array.from({ length: ROWS }, () => Array(COLS).fill(v));
const nearest = (x, y) => ({ c: clamp(Math.round((x - T / 2) / T), 0, COLS - 1), r: clamp(Math.round((y - T / 2) / T), 0, ROWS - 1) });
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function ell(g, x, y, rx, ry, rot = 0) { g.beginPath(); g.ellipse(x, y, Math.max(0.01, rx), Math.max(0.01, ry), rot, 0, TAU); }
function rrect(g, x, y, w, h, r) { g.beginPath(); if (g.roundRect) { g.roundRect(x, y, w, h, r); return; } g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function mk(w, h, res = RES) { const c = document.createElement('canvas'); c.width = w * res; c.height = h * res; const g = c.getContext('2d'); g.scale(res, res); return [c, g]; }
function resize() {
  const wrap = document.getElementById('wrap');
  const s = Math.max(0.3, Math.min(wrap.clientWidth / W, wrap.clientHeight / H));
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cvs.style.width = Math.floor(W * s) + 'px'; cvs.style.height = Math.floor(H * s) + 'px';
  cvs.width = Math.floor(W * s * dpr); cvs.height = Math.floor(H * s * dpr); K = cvs.width / W;
}
window.addEventListener('resize', resize);

// ═══════════════════════ Áudio (sintetizado, original) ═══════════════════════
let AC = null, master = null, musicG = null, verb = null, muted = false, musicOn = true, mStep = 0, nextT = 0, noiseBuf = null;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.45; master.connect(AC.destination);
    verb = AC.createConvolver();
    const len = AC.sampleRate * 1.6, ib = AC.createBuffer(2, len, AC.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = ib.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
    verb.buffer = ib; const vg = AC.createGain(); vg.gain.value = 0.22; verb.connect(vg); vg.connect(AC.destination);
    musicG = AC.createGain(); musicG.gain.value = 0.3; musicG.connect(master); musicG.connect(verb);
    nextT = AC.currentTime + 0.1;
  } catch (e) { AC = null; }
}
function tone(f, d, type = 'square', v = 0.12, slide = 0, delay = 0, dest, rv = 0.5) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + d);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(dest || master); if (!dest && verb && rv) { const r = AC.createGain(); r.gain.value = rv; g.connect(r); r.connect(verb); }
  o.start(t); o.stop(t + d + 0.05);
}
function noise(d, v = 0.15, freq = 900, delay = 0, type = 'lowpass', dest) {
  if (!AC || muted) return;
  if (!noiseBuf) { noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const ch = noiseBuf.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1; }
  const t = AC.currentTime + delay, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = type; f.frequency.value = freq;
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  s.connect(f); f.connect(g); g.connect(dest || master); s.start(t); s.stop(t + d + 0.05);
}
const SFX = {
  dig: () => noise(0.06, 0.05, 500),
  cherry: n => { const f = 660 * Math.pow(2, Math.min(n, 8) * 2 / 12); tone(f, 0.12, 'triangle', 0.14); tone(f * 2, 0.08, 'sine', 0.05, 0, 0.03); },
  chain: () => [0, 4, 7, 12, 16].forEach((s, i) => tone(523 * Math.pow(2, s / 12), 0.16, 'triangle', 0.13, 0, i * 0.06)),
  throw: () => tone(380, 0.18, 'sawtooth', 0.06, 2.4),
  ready: () => { tone(880, 0.07, 'sine', 0.08); tone(1320, 0.09, 'sine', 0.06, 0, 0.06); },
  hit: () => { tone(220, 0.25, 'square', 0.1, 0.4); noise(0.2, 0.12, 2200); },
  clank: () => { tone(1200, 0.08, 'square', 0.08, 0.6); tone(800, 0.12, 'triangle', 0.08, 0.5, 0.05); },
  wobble: () => tone(150, 0.12, 'triangle', 0.08, 0.8),
  fall: () => tone(900, 0.45, 'sine', 0.07, 0.35),
  thud: () => { tone(90, 0.3, 'sine', 0.25, 0.5); noise(0.25, 0.18, 400); },
  crush: () => { tone(160, 0.35, 'square', 0.1, 0.3); noise(0.3, 0.15, 900); },
  death: () => [0, -3, -6, -9, -12, -15].forEach((s, i) => tone(440 * Math.pow(2, s / 12), 0.22, 'square', 0.08, 0, i * 0.12)),
  clear: () => [0, 4, 7, 12, 7, 12, 16, 19].forEach((s, i) => tone(392 * Math.pow(2, s / 12), 0.2, 'triangle', 0.13, 0, i * 0.09)),
  gem: () => [0, 7, 12, 19, 24].forEach((s, i) => tone(784 * Math.pow(2, s / 12), 0.25, 'sine', 0.09, 0, i * 0.05)),
  life: () => [0, 5, 9, 12, 16].forEach((s, i) => tone(523 * Math.pow(2, s / 12), 0.18, 'square', 0.07, 0, i * 0.08)),
  letter: () => [0, 12].forEach((s, i) => tone(988 * Math.pow(2, s / 12), 0.2, 'sine', 0.1, 0, i * 0.08)),
  power: () => [0, 4, 7].forEach((s, i) => tone(660 * Math.pow(2, s / 12), 0.15, 'square', 0.07, 0, i * 0.05)),
  buzz: () => tone(240, 0.3, 'sawtooth', 0.03, 1.2),
  dud: () => tone(140, 0.1, 'square', 0.06),
  select: () => tone(880, 0.06, 'square', 0.05),
  tick: () => tone(1500, 0.04, 'square', 0.04),
  drum: () => { noise(0.35, 0.5, 220); tone(55, 0.5, 'sine', 0.4, 0.5); tone(110, 0.2, 'triangle', 0.15, 0.6, 0.02); },
  slash: () => { noise(0.14, 0.28, 3200, 0, 'highpass'); tone(900, 0.12, 'sawtooth', 0.05, 0.3); },
  furia: () => { noise(0.6, 0.5, 400); [0, 7, 12, 19].forEach((k, i) => tone(220 * Math.pow(2, k / 12), 0.5, 'sawtooth', 0.08, 0, i * 0.06)); tone(40, 1.2, 'sine', 0.35, 0.6); },
  bossHit: () => { tone(300, 0.2, 'square', 0.12, 0.4); noise(0.25, 0.3, 1500); },
  victory: () => { SFX.drum(); [0, 4, 7, 12, 16, 19, 24].forEach((k, i) => tone(330 * Math.pow(2, k / 12), 0.35, 'triangle', 0.12, 0, 0.3 + i * 0.1)); },
  near: () => tone(1800, 0.05, 'sine', 0.05, 0.6),
};
const MEL_DAY = [12, null, 16, 19, 21, null, 19, 16, 14, null, 16, null, 12, null, 9, null, 12, null, 16, 19, 21, null, 24, 21, 19, null, 16, 14, 16, null, null, null,
                 21, null, 19, 21, 24, null, 21, 19, 16, null, 19, null, 14, null, 12, null, 9, null, 12, 14, 16, null, 14, 12, 9, null, 7, 9, 12, null, null, null];
const MEL_NIGHT = [12, null, 15, null, 19, null, 15, 12, 10, null, 12, null, 7, null, null, null, 12, null, 15, 17, 19, null, 22, 19, 17, null, 15, null, 12, null, null, null,
                   19, null, 17, 15, 12, null, 15, null, 10, null, 12, 15, 17, null, 15, null, 12, null, 10, null, 7, null, 10, 12, 10, null, 7, null, null, null, null, null];
const BASS = [0, 0, 7, 7, 9, 9, 7, 7, 5, 5, 4, 4, 2, 2, 7, 7];
const BASS_N = [0, 0, 3, 3, 5, 5, 3, 3, 10, 10, 8, 8, 7, 7, 5, 5];
function musicTick() {
  if (!AC || muted || !musicOn || !(state === 'play' || state === 'intro') || paused) { if (AC) nextT = AC.currentTime + 0.05; return; }
  const bpm = (bonus ? 160 : 132) + Math.min(level, 10) * 3, sd = 60 / bpm / 2, night = tod === 2;
  const MEL = night ? MEL_NIGHT : MEL_DAY, BS = night ? BASS_N : BASS;
  while (nextT < AC.currentTime + 0.15) {
    const d = Math.max(0, nextT - AC.currentTime), m = MEL[mStep % MEL.length];
    if (m !== null) tone(261.63 * Math.pow(2, m / 12), sd * 1.6, night ? 'sine' : 'triangle', 0.09, 0, d, musicG);
    if (mStep % 4 === 0) tone(65.41 * Math.pow(2, BS[(mStep / 4 | 0) % 16] / 12), sd * 3.2, 'sine', 0.16, 0, d, musicG);
    if (mStep % 2 === 1) noise(0.03, 0.025, 6000, d, 'highpass', musicG);
    if (mStep % 8 === 4) noise(0.1, 0.06, 1200, d, 'bandpass', musicG);
    mStep++; nextT += sd;
  }
}
setInterval(musicTick, 50);

// ═══════════════════════ Terreno ═══════════════════════
const [dirtC, dctx] = mk(PW, PH), [bgC, bctx] = mk(PW, PH);
const compC = document.createElement('canvas'); compC.width = PW * RES; compC.height = PH * RES; const kctx = compC.getContext('2d');
const lightC = document.createElement('canvas'); lightC.width = PW; lightC.height = PH; const lg = lightC.getContext('2d');
let terrainDirty = true, lastComp = 0, soil = SOILS[0], tod = 0, TD = TODS[0];
function buildTerrain() {
  bctx.globalCompositeOperation = 'source-over';
  let g = bctx.createLinearGradient(0, 0, 0, PH); g.addColorStop(0, soil.tun[0]); g.addColorStop(1, soil.tun[1]);
  bctx.fillStyle = g; bctx.fillRect(0, 0, PW, PH);
  for (let i = 0; i < 1600; i++) { bctx.fillStyle = `rgba(255,220,180,${rnd(0.02, 0.08)})`; bctx.fillRect(rnd(0, PW), rnd(0, PH), rnd(0.6, 1.8), rnd(0.6, 1.8)); }
  dctx.globalCompositeOperation = 'source-over'; dctx.clearRect(0, 0, PW, PH);
  g = dctx.createLinearGradient(0, 0, 0, PH); g.addColorStop(0, soil.a); g.addColorStop(0.55, soil.b); g.addColorStop(1, soil.c);
  dctx.fillStyle = g; dctx.fillRect(0, 0, PW, PH);
  for (let i = 0; i < 10; i++) {
    const y0 = rnd(-10, PH), th = rnd(10, 36), ph = rnd(0, 6);
    dctx.fillStyle = i % 2 ? 'rgba(255,225,180,0.06)' : 'rgba(0,0,0,0.1)';
    dctx.beginPath(); dctx.moveTo(0, y0);
    for (let x = 0; x <= PW; x += 16) dctx.lineTo(x, y0 + Math.sin(x * 0.012 + ph) * 7);
    for (let x = PW; x >= 0; x -= 16) dctx.lineTo(x, y0 + th + Math.sin(x * 0.015 + ph * 1.3) * 6);
    dctx.closePath(); dctx.fill();
  }
  for (let i = 0; i < 7000; i++) { dctx.globalAlpha = rnd(0.25, 0.8); dctx.fillStyle = pick(soil.speck); const s = rnd(0.7, 2.4); dctx.fillRect(rnd(0, PW), rnd(0, PH), s, s); }
  dctx.globalAlpha = 1;
  for (let i = 0; i < 90; i++) {
    const x = rnd(0, PW), y = rnd(0, PH), r = rnd(2, 7), rot = rnd(0, 3);
